  <style>
:root{
  --bg:#000;
  --card:#0d0d0d;--card2:#151515;--card3:#1f1f1f;
  --blue:#ededed;--blue2:#d4d4d4;--blue3:#bcbcbc;
  --hero1:#161616;--hero2:#070707;
  --text:#fff;--muted:#777;--muted2:#a0a0a0;
  --gold:#ffffff;--gold2:#cfcfcf;
  --ton:#3aa6ff;--green:#22c55e;
  --line:rgba(255,255,255,.10);
  --glow:rgba(255,255,255,.16);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;padding-bottom:86px;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 14px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.user-row{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:#000;flex-shrink:0;box-shadow:0 4px 16px rgba(255,255,255,.35)}
.user-meta{display:flex;flex-direction:column;gap:2px}
.username{font-weight:700;font-size:15px;color:#fff}
.user-subbal{font-size:12px;color:var(--muted2)}
.lang-switch{background:var(--card2);color:var(--gold);border:1px solid var(--line);padding:7px 16px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s}
.lang-switch:active{opacity:.7;transform:scale(.96)}

/* ---- CINEMATIC PAGE TRANSITIONS ---- */
.page{will-change:transform,opacity,filter}
.page-enter{animation:pageEnter .5s cubic-bezier(.16,1,.3,1)}
@keyframes pageEnter{0%{opacity:0;transform:scale(1.06) translateY(14px);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
.page-exit{animation:pageExit .24s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes pageExit{0%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:scale(.92) translateY(-10px);filter:blur(6px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- HERO ---- */
.hero-card{background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.22),rgba(0,0,0,0) 62%),linear-gradient(165deg,var(--hero1),var(--hero2));border-radius:var(--radius);padding:22px;margin-bottom:12px;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 44px var(--glow),inset 0 1px 0 rgba(255,255,255,.12)}
.hero-card::after{content:'';position:absolute;top:-70px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);border-radius:50%;pointer-events:none}
.hero-platform{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;opacity:.85}
.hero-name{font-size:34px;font-weight:900;letter-spacing:-1px;margin-bottom:18px;background:linear-gradient(135deg,#ffffff,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,255,255,.25);display:inline-block}
.hero-wallet{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:11px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--gold)}
.hero-stats{display:flex;gap:9px}
.hero-stat{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:14px;padding:13px 11px}
.hero-stat .hv{font-size:23px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .hl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;margin-top:4px}

.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.block-hdr{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;opacity:.8}
.muted{color:var(--muted2);font-size:14px;line-height:1.65}
.btn{width:100%;border:none;border-radius:13px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.97);opacity:.92}
.btn:disabled{opacity:.32;cursor:default}
.btn:disabled:active{transform:none;opacity:.32}
.btn-white{background:linear-gradient(135deg,#fff,#ededed);color:#000}
.btn-blue{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;box-shadow:0 6px 22px rgba(255,255,255,.28)}
.btn-dark{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn-green{background:linear-gradient(135deg,#34d36b,#16a34a);color:#04210f}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;border-radius:11px}
input.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:14px 15px;color:var(--text);font-size:16px;font-family:inherit;margin-bottom:10px;transition:border-color .2s,box-shadow .2s;outline:none}
input.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:8px}
.row .info{display:flex;flex-direction:column;gap:3px}
.row .title{font-weight:700;font-size:14px}
.row .sub{color:var(--muted2);font-size:12px}

/* ---- CHECK-IN ---- */
.ci-card{background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.18),rgba(0,0,0,0) 62%),linear-gradient(165deg,var(--hero1),var(--hero2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 0 36px var(--glow)}
.ci-hdr{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;opacity:.85}
.ci-stats{display:flex;gap:8px;margin-bottom:12px}
.ci-stat{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.ci-stat .cv{font-size:23px;font-weight:900;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ci-stat .cl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.ci-days{display:flex;gap:5px;margin-bottom:12px}
.ci-day{flex:1;background:rgba(0,0,0,.35);border:1px solid transparent;border-radius:10px;padding:8px 2px;text-align:center;transition:all .2s}
.ci-day.cur{background:rgba(255,255,255,.16);border-color:var(--line);box-shadow:0 0 16px rgba(255,255,255,.2)}
.ci-day .dn{font-size:10px;font-weight:800;color:var(--muted2);display:block}
.ci-day.cur .dn{color:var(--gold)}
.ci-day .dx{font-size:9px;color:var(--muted);display:block;margin-top:2px}
.ci-day.cur .dx{color:#fff}
.ci-hint{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12px;color:var(--muted2);line-height:1.55;margin-bottom:12px}

/* ---- REFERRALS ---- */
.ref-card{background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.18),rgba(0,0,0,0) 62%),linear-gradient(165deg,var(--hero1),var(--hero2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 0 36px var(--glow)}
.ref-title{font-size:19px;font-weight:900;margin-bottom:4px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ref-sub{font-size:12px;color:var(--muted2);margin-bottom:14px}
.ref-stats{display:flex;gap:8px;margin-bottom:14px}
.ref-stat{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.ref-stat .rv{font-size:21px;font-weight:900;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ref-stat .rl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.ref-cols{display:flex;gap:10px}
.ref-col{flex:1}
.ref-col-hdr{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;opacity:.8}
.ref-item{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.ref-item .ru{font-weight:700}
.ref-item .re{color:var(--gold);font-weight:700}

/* ---- PROFILE ---- */
.profile-card{background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.22),rgba(0,0,0,0) 60%),linear-gradient(165deg,var(--hero1),var(--hero2));border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:10px;text-align:center;position:relative;overflow:hidden;box-shadow:0 0 44px var(--glow)}
.profile-avatar{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#000;margin:0 auto 10px;box-shadow:0 6px 24px rgba(255,255,255,.4)}
.profile-name{font-size:21px;font-weight:900;margin-bottom:16px}
.profile-stats{display:flex;gap:8px}
.profile-stat{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:13px;padding:12px}
.profile-stat .pv{font-size:18px;font-weight:900;letter-spacing:-.3px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.profile-stat .pl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.wallet-row{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px}
.wallet-icon{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.wallet-info{flex:1}
.wallet-addr{font-weight:700;font-size:14px}
.wallet-status{font-size:12px;color:var(--green);margin-top:2px;display:flex;align-items:center;gap:4px}

/* ---- OPERATIONS LIST ---- */
.op-row{display:flex;align-items:center;gap:13px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:9px;cursor:pointer;transition:all .18s;font-family:inherit;text-align:left;position:relative;overflow:hidden}
.op-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--gold2));opacity:0;transition:opacity .2s}
.op-row:active{transform:scale(.985);background:var(--card3)}
.op-row:active::before{opacity:1}
.op-row-ic{width:46px;height:46px;border-radius:13px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(255,255,255,.3))}
.op-row-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.op-row-t{font-size:15px;font-weight:800;color:#fff}
.op-row-s{font-size:12px;color:var(--muted2)}
.op-row-arrow{font-size:24px;color:var(--gold);font-weight:400;opacity:.7;flex-shrink:0}
.op-row-soon{opacity:.55;cursor:default}
.op-row-soon:active{transform:none;background:var(--card2)}

/* ---- PvP ---- */
.pvp-top{display:flex;justify-content:space-between;align-items:center;padding:2px 0 14px}
.pvp-logo{display:flex;align-items:center;gap:8px}
.pvp-logo-icon{font-size:22px}
.pvp-logo-text{font-size:20px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pvp-round{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;font-size:11px;font-weight:800;padding:4px 10px;border-radius:9px;letter-spacing:.3px}
.pvp-info-btn{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);color:var(--muted2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:11px;cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0}
.pvp-info-btn:active{transform:scale(.95);opacity:.8}
.pvp-info-i{font-size:14px;color:var(--gold)}
.pvp-about-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.pvp-about-overlay.show{display:flex;animation:fadeOv .2s ease;touch-action:none}
@keyframes fadeOv{from{opacity:0}to{opacity:1}}
.pvp-about-sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#111,#070707);border:1px solid var(--line);border-radius:18px;padding:14px 16px;max-height:85vh;overflow-y:auto;animation:sheetUp .28s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.pvp-about-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pvp-about-title{font-size:18px;font-weight:900;color:#fff}
.pvp-about-x{font-size:18px;color:var(--muted);cursor:pointer;padding:4px 8px}
.pvp-about-how{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.pvp-about-how-t{font-size:13px;font-weight:800;color:#fff;margin-bottom:3px}
.pvp-about-how-d{font-size:12px;color:var(--muted2);line-height:1.45}
.pvp-about-rules{display:flex;flex-direction:column;gap:0;margin-bottom:12px}
.pvp-about-rule{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.pvp-about-rule:last-child{border-bottom:none}
.pvp-about-rule-ic{font-size:18px;flex-shrink:0;width:24px;text-align:center}
.pvp-about-rule-t{font-size:13px;font-weight:800;color:#fff;margin-bottom:2px}
.pvp-about-rule-d{font-size:11.5px;color:var(--muted2);line-height:1.4}
.pvp-banks{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;padding:0 2px}
.pvp-bank-side{display:flex;flex-direction:column;gap:3px}
.pvp-bank-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.pvp-bank-val{font-size:27px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pvp-mybal-val{font-size:18px;font-weight:900;color:var(--gold);text-align:right}
.wheel-wrap{position:relative;width:264px;height:264px;margin:0 auto 14px}
.wheel{width:100%;height:100%;border-radius:50%;transition:transform 4s cubic-bezier(.17,.67,.2,1);background:var(--card2);border:2px solid rgba(255,255,255,.2);box-shadow:0 0 0 1px #000,0 0 40px rgba(255,255,255,.18),inset 0 0 30px rgba(0,0,0,.6)}
.wheel.idle{animation:wheel-idle 6s linear infinite;transition:none}
@keyframes wheel-idle{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:98px;height:98px;border-radius:50%;background:#000;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--gold);z-index:6;text-align:center;padding:8px;box-shadow:0 0 24px rgba(255,255,255,.25),inset 0 0 18px rgba(0,0,0,.9)}
.wheel-pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:18px solid var(--gold);z-index:6;filter:drop-shadow(0 2px 6px rgba(255,255,255,.6))}
.pvp-input-row{display:flex;gap:8px;margin-bottom:8px;align-items:stretch}
.pvp-input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:14px 15px;color:var(--text);font-size:17px;font-family:inherit;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
.pvp-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.pvp-bet-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border:none;border-radius:13px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;box-shadow:0 6px 22px rgba(255,255,255,.28)}
.pvp-bet-btn:active{transform:scale(.97)}
.pvp-amts{display:flex;gap:6px;margin-bottom:14px}
.pvp-amt{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 4px;text-align:center;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;color:#fff}
.pvp-amt:active{background:var(--card3);transform:scale(.96)}
.pvp-section-lbl{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;opacity:.85}
.player-card{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:7px}
.player-card .pname{font-weight:700;font-size:14px}
.player-card .pchance{font-weight:800;font-size:13px;color:var(--gold)}
.pvp-empty{color:var(--muted2);font-size:14px;text-align:center;padding:16px 0}
.pvp-warning{color:#f59e0b;font-size:13px;text-align:center;padding:6px 0;display:flex;align-items:center;justify-content:center;gap:5px}
.hash{text-align:center;color:var(--muted);font-size:11px;margin-top:10px;font-family:monospace;padding:8px 12px;background:var(--card2);border:1px solid var(--line);border-radius:11px}

/* ---- PvP SUB-TABS ---- */
.pvp-subtab-btn{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-weight:700;font-size:13px;color:var(--muted2);cursor:pointer;transition:all .18s;font-family:inherit}
.pvp-subtab-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;box-shadow:0 4px 16px rgba(255,255,255,.25)}
.pvp-subtab-btn:active{transform:scale(.97)}

/* ---- LOTTERY ---- */
.lottery-slot{flex:1;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;transition:all .15s;position:relative;min-width:0}
.lottery-slot.filled{border-color:rgba(255,255,255,.25)}
.lottery-slot.lottery-slot-active{border-color:#ffd60a;background:rgba(255,214,10,.08);box-shadow:0 0 18px rgba(255,214,10,.45);transform:scale(1.07)}
.lottery-slot-avatar{width:42px;height:42px;border-radius:50%;margin:0 auto 6px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;overflow:hidden;position:relative}
.lottery-slot-name{font-size:10px;color:var(--muted2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:0 2px}

/* ---- TABBAR ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 4px 18px;z-index:50}
.tab{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1;padding:4px;transition:all .2s}
.tab-ic{font-size:20px;opacity:.4;transition:all .25s;filter:grayscale(1)}
.tab-label{font-size:10px;font-weight:700;letter-spacing:.2px;transition:color .25s}
.tab.active .tab-ic{opacity:1;filter:none;transform:translateY(-2px) scale(1.08)}
.tab.active .tab-label{color:var(--gold)}
.tab-center{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;padding:0 4px 0;transition:all .2s}
.tab-center-btn{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 22px rgba(255,255,255,.5);margin-bottom:2px;transition:all .2s;margin-top:-16px}
.tab-center.active .tab-center-btn{box-shadow:0 4px 28px rgba(255,255,255,.75);transform:scale(1.04)}
.tab-center .tab-label{font-size:10px;font-weight:700;color:var(--muted);transition:color .2s}
.tab-center.active .tab-label{color:var(--gold)}

/* ---- MODAL ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay[hidden]{display:none}
.modal-box{background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;width:100%;max-width:520px;padding:22px;position:relative;animation:slideup .3s cubic-bezier(.16,1,.3,1);box-shadow:0 -10px 60px rgba(255,255,255,.1)}
.modal-box::before{content:'';display:block;width:38px;height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin:0 auto 18px}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.modal-close{position:absolute;top:16px;right:16px;background:var(--card2);border:1px solid var(--line);color:var(--muted2);width:32px;height:32px;border-radius:50%;font-size:13px;cursor:pointer}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:13px;font-size:14px;font-weight:700;z-index:200;animation:fade .2s;box-shadow:0 8px 36px rgba(0,0,0,.7),0 0 24px rgba(255,255,255,.12);white-space:nowrap}
.tag{display:inline-block;background:var(--card2);color:var(--muted2);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.tag-done{background:rgba(34,197,94,.15);color:var(--green)}
.tag-soon{background:rgba(255,255,255,.15);color:var(--gold);border:1px solid var(--line)}
.sep{height:1px;background:var(--line);margin:12px 0}
  </style>
</head>
<body>
  <canvas id="bgCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none"></canvas>
  <div id="app" style="position:relative;z-index:1">
    <header class="topbar">
      <div class="user-row">
        <div class="avatar" id="topAvatar"></div>
        <div class="user-meta">
          <div class="username" id="topUsername">@...</div>
          <div class="user-subbal" id="topSubBal">0 TON · 0 ARC</div>
        </div>
      </div>
      <button class="lang-switch" id="langBtn">RU</button>
    </header>

    <main id="content">
      <section class="page" id="page-main"></section>
      <section class="page" id="page-tasks" hidden></section>
      <section class="page" id="page-pvp" hidden></section>
      <section class="page" id="page-friends" hidden></section>
      <section class="page" id="page-profile" hidden></section>
    </main>

    <nav class="tabbar">
      <button class="tab" data-tab="pvp">
        <span class="tab-ic">⚔️</span>
        <span class="tab-label" data-i="tab_pvp">PvP</span>
      </button>
      <button class="tab" data-tab="tasks">
        <span class="tab-ic">📋</span>
        <span class="tab-label" data-i="tab_tasks">Задания</span>
      </button>
      <button class="tab-center active" data-tab="main">
        <div class="tab-center-btn">🏠</div>
        <span class="tab-label" data-i="tab_main">Главное</span>
      </button>
      <button class="tab" data-tab="friends">
        <span class="tab-ic">👥</span>
        <span class="tab-label" data-i="tab_friends">Друзья</span>
      </button>
      <button class="tab" data-tab="profile">
        <span class="tab-ic">👤</span>
        <span class="tab-label" data-i="tab_profile">Профиль</span>
      </button>
    </nav>
  </div>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
  <script src="/js/i18n.js?v=33"></script>
  <script src="/js/app.js?v=58"></script>
<script>
/* ============ CINEMATIC BLACK HOLE ENGINE ============ */
(function(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  let W, H, R, cx, cy, DPR;
  let t = 0;
  let stars = [], disk = [], dust = [], meteors = [];
  let glow;
  let lastMeteorAt = -999999;

  /* soft bloom sprite (cool-white) reused for everything */
  function makeGlow(size){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.22,'rgba(244,248,255,0.6)');
    g.addColorStop(0.5, 'rgba(214,226,255,0.2)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.fillRect(0,0,size,size);
    return c;
  }

  function spawnMeteors(){
    lastMeteorAt = Date.now();
    for(let i=0;i<38;i++){
      const speed = 9 + Math.random()*10;
      const ang = (48 + (Math.random()-0.5)*18) * Math.PI/180;
      const delay = Math.floor(Math.random()*50);
      meteors.push({
        x: Math.random()*(W*1.4)-W*0.2,
        y: -15 - Math.random()*H*0.35,
        vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
        life: -delay, maxLife: 32+Math.random()*28,
        sz: 0.5+Math.random()*1.6,
      });
    }
  }

  function init(){
    glow = makeGlow(64);
    meteors = [];
    // starfield with depth/parallax
    stars = [];
    const sn = Math.round(W * H / 11000);
    for (let i=0;i<sn;i++) stars.push({
      x:Math.random()*W, y:Math.random()*H,
      z:Math.random(), ph:Math.random()*6.283, sp:0.5+Math.random()*1.7,
    });
    // accretion disk particles (concentrated near the inner edge)
    disk = [];
    const dn = 340;
    for (let i=0;i<dn;i++){
      const r = R * (1.16 + Math.pow(Math.random(),1.8) * 1.75);
      disk.push({
        a:Math.random()*6.283, r,
        w:(0.30+0.55*Math.random())/Math.pow(r/R,1.5),
        s:0.55+Math.random()*1.1,
      });
    }
    // drifting cosmic dust
    dust = [];
    for (let i=0;i<44;i++) dust.push({
      x:Math.random()*W, y:Math.random()*H, r:0.4+Math.random()*1.3,
      vx:(Math.random()-0.5)*0.1, vy:(Math.random()-0.5)*0.1, o:0.05+Math.random()*0.16,
    });
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    R = Math.min(W, H) * 0.155;
    cx = W / 2; cy = H * 0.32;
    init();
  }

  const TILT = 0.33;

  function frame(){
    t++;
    ctx.setTransform(DPR,0,0,DPR,0,0);

    /* deep-space base + faint neutral nebula */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
    const neb = ctx.createRadialGradient(cx,cy,R*0.4,cx,cy,Math.max(W,H)*0.85);
    neb.addColorStop(0,'rgba(48,52,64,0.20)');
    neb.addColorStop(0.45,'rgba(22,24,30,0.10)');
    neb.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = neb;
    ctx.fillRect(0,0,W,H);

    /* stars */
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars){
      const tw = 0.35 + 0.65*(0.5+0.5*Math.sin(t*0.02*s.sp + s.ph));
      const sz = 0.6 + s.z*1.7;
      ctx.globalAlpha = tw*(0.22 + s.z*0.5);
      ctx.drawImage(glow, s.x-sz*3, s.y-sz*3, sz*6, sz*6);
    }
    ctx.globalAlpha = 1;

    /* project disk, split front/back for correct occlusion */
    const back = [], front = [];
    for (const p of disk){
      p.a += p.w * 0.02;
      const ca = Math.cos(p.a), sa = Math.sin(p.a);
      const o = { px:cx+p.r*ca, py:cy+p.r*sa*TILT, depth:sa, r:p.r, s:p.s };
      (sa < 0 ? back : front).push(o);
    }
    function part(o){
      const heat = Math.max(0, Math.min(1,(R*2.9 - o.r)/(R*1.75)));
      const fr = (o.depth+1)/2;
      const a = (0.07 + 0.5*heat)*(0.38 + 0.62*fr)*o.s;
      const sz = (2 + heat*5.5)*(0.7 + 0.5*fr)*o.s;
      ctx.globalAlpha = Math.min(1, a);
      ctx.drawImage(glow, o.px-sz*2, o.py-sz*2, sz*4, sz*4);
    }

    /* back half (rendered behind the event horizon) */
    ctx.globalCompositeOperation = 'lighter';
    for (const o of back) part(o);
    ctx.globalAlpha = 1;

    /* event horizon */
    ctx.globalCompositeOperation = 'source-over';
    const hg = ctx.createRadialGradient(cx,cy,R*0.55,cx,cy,R*1.3);
    hg.addColorStop(0,'#000'); hg.addColorStop(0.8,'#000'); hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(cx,cy,R*1.3,0,6.2832); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx,cy,R,0,6.2832); ctx.fill();

    /* photon / Einstein ring + halo bloom */
    ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(cx,cy,R*(1.018+i*0.012),0,6.2832);
      ctx.strokeStyle = `rgba(255,255,255,${0.55-i*0.15})`;
      ctx.lineWidth = 2.3 - i*0.65;
      ctx.stroke();
    }
    for (let k=0;k<80;k++){
      const ang = k/80*6.2832;
      const rr = R*1.045;
      ctx.globalAlpha = 0.09;
      ctx.drawImage(glow, cx+Math.cos(ang)*rr-11, cy+Math.sin(ang)*rr-11, 22, 22);
    }
    ctx.globalAlpha = 1;

    /* front half (over the event horizon) */
    for (const o of front) part(o);
    ctx.globalAlpha = 1;

    /* gravitationally-lensed arc bending over the top */
    for (let k=0;k<64;k++){
      const u = k/63;
      const ang = Math.PI + u*Math.PI;
      const rr = R*1.95;
      const ax = cx + Math.cos(ang)*rr;
      const ay = cy + Math.sin(ang)*rr*0.40;
      const sh = 0.5 + 0.5*Math.sin(t*0.05 + u*9);
      ctx.globalAlpha = 0.11*sh;
      ctx.drawImage(glow, ax-15, ay-15, 30, 30);
    }
    ctx.globalAlpha = 1;

    /* dust */
    for (const d of dust){
      d.x += d.vx; d.y += d.vy;
      if (d.x<0) d.x=W; else if (d.x>W) d.x=0;
      if (d.y<0) d.y=H; else if (d.y>H) d.y=0;
      ctx.globalAlpha = d.o;
      ctx.drawImage(glow, d.x-d.r*3, d.y-d.r*3, d.r*6, d.r*6);
    }
    ctx.globalAlpha = 1;

    /* meteor shower — triggers every 45s, lasts ~3s */
    if(Date.now() - lastMeteorAt > 45000) spawnMeteors();
    ctx.globalCompositeOperation = 'lighter';
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      if(m.life<0){m.life++;continue;}
      m.x+=m.vx; m.y+=m.vy; m.life++;
      const prog=m.life/m.maxLife;
      const al=Math.sin(prog*Math.PI)*0.9;
      if(al>0.01){
        const len=Math.sqrt(m.vx*m.vx+m.vy*m.vy);
        const tl=m.sz*20;
        const tx=m.x-(m.vx/len)*tl, ty=m.y-(m.vy/len)*tl;
        const gr=ctx.createLinearGradient(m.x,m.y,tx,ty);
        gr.addColorStop(0,`rgba(255,255,255,${al})`);
        gr.addColorStop(1,'rgba(255,255,255,0)');
        ctx.strokeStyle=gr; ctx.lineWidth=m.sz;
        ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.globalAlpha=al*0.75;
        ctx.drawImage(glow,m.x-m.sz*4,m.y-m.sz*4,m.sz*8,m.sz*8);
        ctx.globalAlpha=1;
      }
      if(m.life>=m.maxLife||m.x>W+100||m.y>H+100) meteors.splice(i,1);
    }
    ctx.globalAlpha=1;

    /* cinematic vignette */
    ctx.globalCompositeOperation = 'source-over';
    const vg = ctx.createRadialGradient(cx,H*0.5,R,cx,H*0.5,Math.max(W,H)*0.78);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,0.58)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  frame();
})();
</script>
</body>
</html>
