<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARCADE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="username" id="topUsername">@...</div>
      <button class="lang-switch" id="langBtn">RU</button>
    </header>

    <div class="balances" id="balances">
      <div class="bal bal-ton"><span class="ic">💎</span> <span id="balTon">0</span> TON</div>
      <div class="bal bal-arc"><span class="ic">🪙</span> <span id="balArc">0</span> ARC</div>
    </div>

    <main id="content">
      <section class="page" id="page-main"></section>
      <section class="page" id="page-tasks" hidden></section>
      <section class="page" id="page-pvp" hidden></section>
      <section class="page" id="page-friends" hidden></section>
      <section class="page" id="page-profile" hidden></section>
    </main>

    <nav class="tabbar">
      <button class="tab" data-tab="pvp">
        <span class="tab-ic">⚔️</span><span class="tab-label" data-i="tab_pvp">PvP</span>
      </button>
      <button class="tab" data-tab="tasks">
        <span class="tab-ic">📋</span><span class="tab-label" data-i="tab_tasks">Задания</span>
      </button>
      <button class="tab active" data-tab="main">
        <span class="tab-ic">🏠</span><span class="tab-label" data-i="tab_main">Главное</span>
      </button>
      <button class="tab" data-tab="friends">
        <span class="tab-ic">👥</span><span class="tab-label" data-i="tab_friends">Друзья</span>
      </button>
      <button class="tab" data-tab="profile">
        <span class="tab-ic">👤</span><span class="tab-label" data-i="tab_profile">Профиль</span>
      </button>
    </nav>
  </div>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
