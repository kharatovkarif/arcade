<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ARCADE — Аналитика</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#000; --card:#0d0d0d; --line:#1e1e1e; --gold:#ffd60a; --muted:#666; --green:#4ade80; --blue:#60a5fa; --red:#f87171; --orange:#fb923c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px 16px 60px; }
    h1 { font-size:20px; font-weight:900; margin-bottom:4px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
    .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
    .card-val { font-size:26px; font-weight:900; line-height:1.1; }
    .card-label { font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.8px; }
    .charts { display:flex; flex-direction:column; gap:20px; }
    .chart-wrap { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .chart-title { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:12px; }
    canvas { max-height:200px; }
    #error { color:#f87171; text-align:center; padding:40px; }
    #loading { color:var(--muted); text-align:center; padding:40px; }
    .refresh { font-size:12px; color:var(--muted); text-align:right; margin-top:20px; }
    .gold { color:var(--gold); }
    .green { color:var(--green); }
    .blue { color:var(--blue); }
    .red { color:var(--red); }
  </style>
</head>
<body>
  <h1>ARCADE <span class="gold">Analytics</span></h1>
  <div class="sub" id="subtitle">Загружаем данные...</div>
  <div id="loading">⏳ Загружаем...</div>
  <div id="content" style="display:none">
    <div class="cards">
      <div class="card"><div class="card-val gold" id="cTotalUsers">—</div><div class="card-label">Всего пользователей</div></div>
      <div class="card"><div class="card-val blue" id="cTotalAds">—</div><div class="card-label">Рекламы всего</div></div>
      <div class="card"><div class="card-val green" id="cNewToday">—</div><div class="card-label">Новых сегодня</div></div>
      <div class="card"><div class="card-val red" id="cBurnToday">—</div><div class="card-label">ARC сожжено сегодня</div></div>
    </div>
    <div class="charts">
      <div class="chart-wrap"><div class="chart-title gold">👤 Новые пользователи в день</div><canvas id="chartNew"></canvas></div>
      <div class="chart-wrap"><div class="chart-title blue">📺 Просмотры рекламы в день</div><canvas id="chartAds"></canvas></div>
      <div class="chart-wrap"><div class="chart-title green">🟢 Активных пользователей в день</div><canvas id="chartActive"></canvas></div>
      <div class="chart-wrap"><div class="chart-title red">🔥 Сожжено ARC в день</div><canvas id="chartBurn"></canvas></div>
    </div>
    <div class="refresh" id="refreshTime"></div>
  </div>
  <div id="error" style="display:none"></div>

  <script>
    const SECRET = new URLSearchParams(location.search).get('s') || '';
    const charts = {};

    const cfg = (labels, data, color, fill) => ({
      type: fill ? 'bar' : 'line',
      data: {
        labels: labels.map(d => d.slice(5)),
        datasets: [{ data, borderColor: color, backgroundColor: color + (fill ? '99' : '22'),
          borderWidth: fill ? 0 : 2, borderRadius: fill ? 6 : 0, fill: !fill, tension: 0.4,
          pointRadius: 2, pointHoverRadius: 5 }],
      },
      options: {
        responsive: true, maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color:'#555', font:{size:10}, maxTicksLimit:8, maxRotation:0 }, grid:{ color:'#1a1a1a' } },
          y: { ticks: { color:'#555', font:{size:10} }, grid:{ color:'#1a1a1a' }, beginAtZero:true },
        },
      },
    });

    async function load() {
      try {
        const r = await fetch('/api/admin/analytics', { headers:{ 'x-admin-secret': SECRET } });
        if (!r.ok) { showErr('Доступ запрещён (неверный секрет)'); return; }
        const d = await r.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = '';

        const today = d.days[d.days.length - 1];
        const idx = d.days.indexOf(today);
        document.getElementById('cTotalUsers').textContent = (d.totals.users || 0).toLocaleString('ru');
        document.getElementById('cTotalAds').textContent = (d.totals.ads || 0).toLocaleString('ru');
        document.getElementById('cNewToday').textContent = (d.newUsers[idx] || 0).toLocaleString('ru');
        document.getElementById('cBurnToday').textContent = (d.arcBurned[idx] || 0).toLocaleString('ru');

        document.getElementById('subtitle').textContent = 'Последние 30 дней · МСК · обновлено ' + new Date().toLocaleTimeString('ru');

        const GOLD = '#ffd60a', BLUE = '#60a5fa', GREEN = '#4ade80', RED = '#f87171';
        const draw = (id, data, color, fill) => {
          if (charts[id]) charts[id].destroy();
          charts[id] = new Chart(document.getElementById(id), cfg(d.days, data, color, fill));
        };
        draw('chartNew',    d.newUsers,    GOLD,  true);
        draw('chartAds',    d.adViews,     BLUE,  true);
        draw('chartActive', d.activeUsers, GREEN, false);
        draw('chartBurn',   d.arcBurned,   RED,   true);

      } catch(e) { showErr('Ошибка: ' + e.message); }
    }

    function showErr(msg) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = '';
      el.textContent = msg;
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
